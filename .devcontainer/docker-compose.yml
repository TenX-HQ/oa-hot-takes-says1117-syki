services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: /workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-hot-takes-tournament}/app.db
      PYTHONPATH: /workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-hot-takes-tournament}/backend
    volumes:
      - ..:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-hot-takes-tournament}:cached
      - frontend_node_modules:/workspaces/${LOCAL_WORKSPACE_FOLDER_BASENAME:-hot-takes-tournament}/frontend/node_modules
    command: sleep infinity

volumes:
  frontend_node_modules:
